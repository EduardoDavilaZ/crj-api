name: Deploy Laravel to IONOS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies (No Dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy via rsync with Password
        env:
          IONOS_HOST: ${{ secrets.IONOS_HOST }}
          IONOS_USER: ${{ secrets.IONOS_USER }}
          IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
        run: |
          sudo apt-get install -y sshpass
          sshpass -p "$IONOS_PASSWORD" rsync -avz -e "ssh -o StrictHostKeyChecking=no -p 22" --delete --exclude='.git' --exclude='.env' --exclude='node_modules' ./ $IONOS_USER@$IONOS_HOST:./api-crj/
