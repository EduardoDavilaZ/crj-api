name: Deploy Laravel to IONOS

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Install dependencies (No Dev)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Deploy via rsync over SSH
        uses: easingthemes/ssh-deploy@v6
        env:
          SSH_HOST: ${{ secrets.IONOS_HOST }}
          SSH_USER: ${{ secrets.IONOS_USER }}
          SSH_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
          SOURCE: "."
          TARGET: "./api-crj"
          ARGS: "-rltgoDzvO --delete --exclude=.git --exclude=.env --exclude=node_modules"
